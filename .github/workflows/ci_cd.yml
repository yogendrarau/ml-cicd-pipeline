name: ci-cd

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: write   # allow committing updated manifest to repo

jobs:
  ci:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py311-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: PyTest
        run: pytest -q

  train_eval_gate:
    name: Train, Evaluate, Gate
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.gate.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py311-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Train
        run: python src/train.py
      - name: Evaluate
        run: python src/evaluate.py
      - name: Gate (compare & promote)
        id: gate
        run: python scripts/compare_and_promote.py
      - name: Commit updated manifest (on promotion)
        if: steps.gate.outputs.should_deploy == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/production/manifest.json
          git commit -m "ci: promote model to production (run $GITHUB_SHA)"
          git push
      - name: Upload artifacts (model + metrics)
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            artifacts/model.pkl
            artifacts/metrics.json

  deploy:
    name: Deploy (gated)
    needs: train_eval_gate
    if: needs.train_eval_gate.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ Gate passed — this is where you deploy (Cloud Run/ECS)."