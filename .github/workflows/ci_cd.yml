name: ci-cd

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  ci:
    name: Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py311-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: PyTest
        run: pytest -q
      - name: Summary
        if: always()
        run: echo "✅ CI finished for $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY

  train_and_evaluate:
    name: Train & Evaluate (main only)
    if: github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py311-${{ hashFiles('**/requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py311-
      - name: Install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Train
        run: python src/train.py
      - name: Evaluate
        run: python src/evaluate.py
      - name: Upload artifacts (model + metrics)
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.sha }}
          path: |
            artifacts/model.pkl
            artifacts/metrics.json
      - name: Summary
        run: echo "Uploaded model + metrics for $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY